name: Deploy site to GitHub Pages

# Publishes a composite tree:
#
#   main -> /        stable
#   beta -> /beta/   preview, reached through the switch on the BF6 page
#
# dev is deliberately never published: it is where work-in-progress lives and
# is free to be broken. Promotion is always an explicit merge, dev -> beta ->
# main, and this workflow is what makes each promotion visible.
#
# The site needs no changes to live under /beta/ because every link in it is
# relative (href="index.html", bf6.css?v=N, src="map.js"); there are no
# root-absolute URLs anywhere in the repository.

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment: Pages deployments are atomic per run,
# but a cancelled run wastes the slot and leaves a confusing "expected"
# deployment state behind.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # GitHub refuses the deploy job BEFORE it starts when the ref is not
      # allowed to deploy to the github-pages environment, so nothing inside
      # that job gets a chance to explain itself. Say it here instead, where
      # somebody pushing to beta is actually looking.
      - name: Flag the environment rule
        if: github.ref_name == 'beta'
        run: |
          echo "::warning title=Beta deploys need a settings change::Add 'beta' under Settings > Environments > github-pages > Deployment branches and tags. Until then this run's deploy job is rejected before it starts, and it shows up as an empty 'failed' job with no steps at all."

      - name: Checkout stable (main)
        uses: actions/checkout@v7
        with:
          ref: main
          path: stable-src

      # beta may not exist on the first run, so a failed checkout must not fail
      # the job - the assemble step below decides whether to publish it.
      - name: Checkout beta
        id: beta
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: beta
          path: beta-src

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -a stable-src/. site/
          # Never publish VCS or CI metadata to the web root.
          rm -rf site/.git site/.github site/.gitignore

          if [ -d beta-src/.git ]; then
            mkdir -p site/beta
            cp -a beta-src/. site/beta/
            rm -rf site/beta/.git site/beta/.github site/beta/.gitignore
            echo "Published main -> /  and  beta -> /beta/"
          else
            echo "No beta branch found; published main -> / only"
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # The environment key is not optional: deploy-pages deploys through the
  # github-pages environment, and that environment is protected. GitHub creates
  # it allowing only the Pages source branch, so a deployment from any other ref
  # is refused BEFORE this job starts - it reports "failure" with an empty steps
  # array and no runner, while build sits there green. Nothing in this file can
  # catch that, because nothing in this file runs.
  #
  # Two settings have to be right, and they mask each other:
  #
  #   1. Settings > Pages > Source = "GitHub Actions"
  #      Otherwise branch deployments keep winning and nothing here is served.
  #   2. Settings > Environments > github-pages > Deployment branches and tags
  #      must allow beta. This is the one that produces the empty failed job.
  #
  # Environment protection rules take precedence over the source-branch rule, so
  # (2) masks (1): fix (2) first and a run from beta goes green without changing
  # a single byte of the live site. Fix both, then run the workflow.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
